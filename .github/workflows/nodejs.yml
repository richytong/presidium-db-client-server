# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm i && npx nyc --reporter=lcovonly -x tmp -x walk.js -x TextStream.test.js -x TextEntriesStream.test.js -x BinaryStream.test.js -x BinaryEntriesStream.test.js -x AsyncIterator.test.js -x DatabaseServer.test.js -x DatabaseLoadBalancer.test.js npm test && npx codecov --token=291aeb74-c59d-437b-afe4-e8468b03571f --file=coverage/lcov.info

